name: HazardReporter
options:
  bundleIdPrefix: com.hazardreporter
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1"
targets:
  HazardReporter:
    type: application
    platform: iOS
    sources:
      - HazardReporter
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hazardreporter.app
      INFOPLIST_FILE: HazardReporter/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: false
