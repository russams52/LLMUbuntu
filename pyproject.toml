[project]
name = "llmubuntu"
version = "0.1.0"
description = "A minimal FastAPI chat scaffold with a pluggable assistant."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
